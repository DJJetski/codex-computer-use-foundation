name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-safety:
    name: Release safety
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Python version
        run: python3 --version

      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests

      - name: Preview installer without local Codex runtime
        run: scripts/install.py --dry-run --skip-runtime-checks --skip-postinstall

      - name: Run release and secret audits
        run: |
          scripts/secret-scan.py --include-untracked
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/public-release-audit.py --include-untracked --enforce-public-surface --skip-commit-identities
          else
            scripts/public-release-audit.py --include-untracked --enforce-public-surface
          fi
          git diff --check

      - name: Run full history public audit
        if: github.event_name != 'pull_request'
        run: scripts/public-release-audit.py --include-untracked --all-refs --enforce-public-surface

      - name: Build public release
        run: scripts/build-public-release.py --output-dir "${TMPDIR:-/tmp}/public-release"

      - name: Drill downloadable package
        run: scripts/release-drill.py --output-dir "${TMPDIR:-/tmp}/public-release-drill"
