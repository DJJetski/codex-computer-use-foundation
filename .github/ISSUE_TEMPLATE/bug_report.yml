name: Bug report
description: Report a reproducible non-security bug in the repair package.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not use public issues for vulnerabilities, token exposure, private data, or bypass reports. Follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Include exact commands when possible.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: "15.7.5"
  - type: input
    id: codex
    attributes:
      label: Codex Version
      placeholder: "Codex app version, if relevant"
  - type: textarea
    id: output
    attributes:
      label: Redacted Output
      description: Paste only redacted command output or logs. Do not include tokens, cookies, smoke JSON, snapshots, or raw .codex state.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety Checks
      options:
        - label: I removed secrets, local usernames, full home paths, OAuth data, cookies, and raw .codex state.
          required: true
