    <path d="M210 248C242 248 244 186 274 186C304 186 306 284 336 284C366 284 368 158 398 158C428 158 430 230 462 230C494 230 496 186 528 186C560 186 562 256 594 256C626 256 628 170 660 170C692 170 694 246 726 246C758 246 760 194 792 194C824 194 826 268 858 268C890 268 892 168 924 168C956 168 958 214 990 214" stroke="url(#signal)" stroke-width="6" stroke-linecap="round"/>
