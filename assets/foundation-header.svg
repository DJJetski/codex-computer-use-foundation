    <text x="600" y="282" text-anchor="middle" fill="#9BAAB5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="650">Repair the official plugin path. Prove fresh native smoke. Keep fallbacks out.</text>
