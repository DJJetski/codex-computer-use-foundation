<svg width="2400" height="840" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">v0.1.3 Native Computer Use Repair Kit</title>
  <desc id="desc">A release card for Codex Computer Use Foundation v0.1.3 showing native repair, verification, release assets, and security scope.</desc>

