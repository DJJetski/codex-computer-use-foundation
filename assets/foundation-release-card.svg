<svg width="2400" height="840" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">v0.1.3 Native Computer Use Repair Kit</title>
  <desc id="desc">A release card for Codex Computer Use Foundation v0.1.3 showing a clear repair kit release for native Codex Computer Use on macOS.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D10"/>
      <stop offset="1" stop-color="#0B1115"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="270" x2="980" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75F4D4"/>
      <stop offset="0.52" stop-color="#F6C766"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="418" rx="33" stroke="#2A3440" stroke-width="2"/>

  <g filter="url(#soft)">
    <rect x="126" y="82" width="948" height="256" rx="30" fill="#0D1418" stroke="#31404A" stroke-width="2"/>
    <path d="M202 278C246 278 250 226 294 226C338 226 342 296 386 296C430 296 434 214 478 214C522 214 526 252 570 252C614 252 618 234 662 234C706 234 710 272 754 272C798 272 802 218 846 218C890 218 894 252 938 252C982 252 986 230 1030 230" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity="0.46"/>
  </g>

  <rect x="220" y="110" width="760" height="176" rx="26" fill="#0B1115" opacity="0.94"/>
  <text x="600" y="155" text-anchor="middle" fill="#75F4D4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="850" letter-spacing="4">V0.1.3 RELEASE</text>
  <text x="600" y="210" text-anchor="middle" fill="#F6F8FB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="900">Native Computer Use</text>
  <text x="600" y="260" text-anchor="middle" fill="#F6F8FB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="900">Repair Kit</text>
  <text x="600" y="316" text-anchor="middle" fill="#B8C4CC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700">Installable package for Macs where Codex Computer Use is missing or broken.</text>
</svg>
